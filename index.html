<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>刀劍男士顕現帳</title>


    <style>

        body {

            font-family: sans-serif;

            background-color: #f5f1e8;

            color: #333;

            margin: 0;

            padding: 20px;

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        .add-area {

            text-align: center;

            margin-bottom: 25px;

        }


        button {

            padding: 10px 18px;

            font-size: 16px;

            cursor: pointer;

            border: none;

            border-radius: 8px;

            background-color: #8b6f47;

            color: white;

        }


        button:hover {

            background-color: #6f5635;

        }


        #select-area {

            display: none;

            max-width: 600px;

            margin: 20px auto;

            padding: 20px;

            background-color: white;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);

        }


        .step-title {

            margin-top: 20px;

            margin-bottom: 12px;

        }


        .types {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .type-button {

            background-color: #ddd;

            color: #333;

        }


        .type-button.selected {

            background-color: #8b6f47;

            color: white;

        }


        select {

            width: 100%;

            padding: 12px;

            font-size: 16px;

            margin-bottom: 15px;

            box-sizing: border-box;

        }


        .position-option {

            display: flex;

            align-items: center;

            gap: 8px;

            margin: 12px 0;

            font-size: 16px;

        }


        .position-option input {

            width: 18px;

            height: 18px;

        }


        #position-select {

            margin-top: 5px;

        }


        #display-area {

            max-width: 700px;

            margin: 30px auto;

        }


        .sword-card {

            background-color: white;

            border-radius: 12px;

            padding: 15px 20px;

            margin-bottom: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);

        }


        .sword-main {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .sword-info {

            flex: 1;

        }


        .sword-number {

            color: #777;

            font-size: 14px;

        }


        .sword-name {

            font-size: 20px;

            margin: 5px 0;

        }


        .sword-type {

            color: #8b6f47;

        }


        .sword-actions {

            display: flex;

            gap: 8px;

        }


        .small-button {

            padding: 7px 12px;

            font-size: 14px;

        }


        .move-button {

            background-color: #6b7a5c;

        }


        .delete-button {

            background-color: #a55a5a;

        }


        #move-area {

            display: none;

            max-width: 600px;

            margin: 20px auto;

            padding: 20px;

            background-color: #fff8e8;

            border: 2px solid #d6bd8a;

            border-radius: 12px;

        }


        .move-title {

            margin-top: 0;

        }


        .close-button {

            background-color: #999;

            margin-left: 8px;

        }


    </style>

</head>


<body>


    <h1>刀劍男士顕現帳</h1>


    <div class="add-area">

        <button onclick="openSelector()">

            ＋ 追加

        </button>

    </div>



    <!-- ========================= -->
    <!-- 追加區域 -->
    <!-- ========================= -->


    <div id="select-area">


        <h2>① 選擇刀種</h2>


        <div class="types">


            <button
                class="type-button"
                onclick="selectType('短刀', this)">

                短刀

            </button>


            <button
                class="type-button"
                onclick="selectType('脇差', this)">

                脇差

            </button>


            <button
                class="type-button"
                onclick="selectType('打刀', this)">

                打刀

            </button>


            <button
                class="type-button"
                onclick="selectType('太刀', this)">

                太刀

            </button>


            <button
                class="type-button"
                onclick="selectType('大太刀', this)">

                大太刀

            </button>


            <button
                class="type-button"
                onclick="selectType('槍', this)">

                槍

            </button>


            <button
                class="type-button"
                onclick="selectType('薙刀', this)">

                薙刀

            </button>


        </div>



        <h2 class="step-title">

            ② 選擇刀名

        </h2>


        <select id="sword-select">


            <option value="">

                請先選擇刀種

            </option>


        </select>



        <h2 class="step-title">

            ③ 選擇插入位置

        </h2>



        <!-- 最後 -->


        <label class="position-option">


            <input
                type="radio"
                name="position"
                value="last"
                checked
                onchange="changePosition()">


            <span>

                最後

            </span>


        </label>



        <!-- 插入位置 -->


        <label class="position-option">


            <input
                type="radio"
                name="position"
                value="insert"
                onchange="changePosition()">


            <span>

                插入位置

            </span>


        </label>



        <select
            id="position-select"
            disabled>


            <option value="">

                請選擇要插在誰的「前面」

            </option>


        </select>



        <br>


        <button onclick="addSword()">

            追加這把刀

        </button>


        <button
            class="close-button"
            onclick="closeSelector()">

            關閉

        </button>


    </div>



    <!-- ========================= -->
    <!-- 移動區域 -->
    <!-- ========================= -->


    <div id="move-area">


        <h2 class="move-title">

            移動刀劍

        </h2>


        <p id="move-sword-name"></p>



        <h3>

            選擇新的位置

        </h3>



        <label class="position-option">


            <input
                type="radio"
                name="move-position"
                value="last"
                checked
                onchange="changeMovePosition()">


            <span>

                最後

            </span>


        </label>



        <label class="position-option">


            <input
                type="radio"
                name="move-position"
                value="insert"
                onchange="changeMovePosition()">


            <span>

                插入位置

            </span>


        </label>



        <select
            id="move-position-select"
            disabled>


            <option value="">

                請選擇要移到誰的「前面」

            </option>


        </select>


        <br>


        <button onclick="confirmMove()">

            確定移動

        </button>


        <button
            class="close-button"
            onclick="closeMoveArea()">

            取消

        </button>


    </div>



    <!-- ========================= -->
    <!-- 刀劍顯示區域 -->
    <!-- ========================= -->


    <div id="display-area"></div>



    <script>


        /*
         * =========================
         * 刀種與刀名
         * =========================
         */


        const swords = {


            "短刀": [

                "今剣",

                "愛染国俊",

                "秋田藤四郎",

                "厚藤四郎"

            ],


            "脇差": [

                "鯰尾藤四郎",

                "骨喰藤四郎",

                "堀川国広"

            ],


            "打刀": [

                "加州清光",

                "歌仙兼定",

                "陸奥守吉行",

                "山姥切国広"

            ],


            "太刀": [

                "三日月宗近",

                "小狐丸",

                "一期一振",

                "鶴丸国永"

            ],


            "大太刀": [

                "蛍丸",

                "太郎太刀",

                "次郎太刀"

            ],


            "槍": [

                "蜻蛉切",

                "日本号",

                "御手杵"

            ],


            "薙刀": [

                "岩融",

                "巴形薙刀",

                "静形薙刀"

            ]

        };



        /*
         * =========================
         * 目前選擇的刀種
         * =========================
         */


        let selectedType = "";



        /*
         * =========================
         * 已追加刀劍
         * =========================
         */


        let addedSwords = [];



        /*
         * =========================
         * 目前正在移動的刀
         * =========================
         */


        let movingIndex = -1;



        /*
         * =========================
         * 開啟追加區
         * =========================
         */


        function openSelector() {


            document
                .getElementById("select-area")
                .style.display = "block";


            updatePositionList();


        }



        /*
         * =========================
         * 關閉追加區
         * =========================
         */


        function closeSelector() {


            document
                .getElementById("select-area")
                .style.display = "none";


        }



        /*
         * =========================
         * 選擇刀種
         * =========================
         */


        function selectType(type, button) {


            selectedType = type;


            const buttons =
                document.querySelectorAll(
                    ".type-button"
                );


            buttons.forEach(function(btn) {

                btn.classList.remove("selected");

            });


            button.classList.add("selected");


            const select =
                document.getElementById(
                    "sword-select"
                );


            select.innerHTML =
                '<option value="">請選擇刀名</option>';


            swords[type].forEach(
                function(sword) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = sword;

                    option.textContent = sword;


                    select.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 切換追加位置
         * =========================
         */


        function changePosition() {


            const selected =
                document.querySelector(
                    'input[name="position"]:checked'
                ).value;


            const positionSelect =
                document.getElementById(
                    "position-select"
                );


            if (selected === "last") {


                positionSelect.disabled = true;


            } else {


                positionSelect.disabled = false;


            }


        }



        /*
         * =========================
         * 更新追加位置
         * =========================
         */


        function updatePositionList() {


            const positionSelect =
                document.getElementById(
                    "position-select"
                );


            positionSelect.innerHTML =
                '<option value="">請選擇要插在誰的「前面」</option>';


            addedSwords.forEach(
                function(sword, index) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = index;


                    option.textContent =
                        (index + 1)
                        + ". "
                        + sword.name
                        + "　"
                        + sword.type
                        + " 的前面";


                    positionSelect.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 追加刀劍
         * =========================
         */


        function addSword() {


            const select =
                document.getElementById(
                    "sword-select"
                );


            const swordName =
                select.value;


            if (!selectedType) {


                alert(
                    "請先選擇刀種"
                );


                return;


            }


            if (!swordName) {


                alert(
                    "請選擇刀名"
                );


                return;


            }



            /*
             * 防止重複
             */


            const alreadyAdded =
                addedSwords.some(
                    function(sword) {

                        return sword.name
                            === swordName;

                    }
                );


            if (alreadyAdded) {


                alert(
                    "這把刀已經追加過了"
                );


                return;


            }



            const newSword = {


                name: swordName,

                type: selectedType

            };



            const position =
                document.querySelector(
                    'input[name="position"]:checked'
                ).value;



            /*
             * 放在最後
             */


            if (position === "last") {


                addedSwords.push(
                    newSword
                );


            }


            /*
             * 插在指定刀劍前面
             */


            else {


                const positionSelect =
                    document.getElementById(
                        "position-select"
                    );


                const insertIndex =
                    parseInt(
                        positionSelect.value
                    );


                if (
                    isNaN(insertIndex)
                ) {


                    alert(
                        "請選擇插入位置"
                    );


                    return;


                }


                addedSwords.splice(
                    insertIndex,
                    0,
                    newSword
                );


            }



            renderSwords();


            updatePositionList();


            /*
             * 追加完成後
             * 回到預設「最後」
             */


            document.querySelector(
                'input[name="position"][value="last"]'
            ).checked = true;


            changePosition();


            select.value = "";


        }



        /*
         * =========================
         * 顯示刀劍
         * =========================
         */


        function renderSwords() {


            const display =
                document.getElementById(
                    "display-area"
                );


            display.innerHTML = "";


            addedSwords.forEach(
                function(sword, index) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "sword-card";


                    card.innerHTML = `

                        <div class="sword-main">


                            <div class="sword-info">


                                <div class="sword-number">

                                    ${index + 1}.

                                </div>


                                <div class="sword-name">

                                    ${sword.name}

                                </div>


                                <div class="sword-type">

                                    ${sword.type}

                                </div>


                            </div>


                            <div class="sword-actions">


                                <button
                                    class="small-button move-button"
                                    onclick="startMove(${index})">

                                    移動

                                </button>


                                <button
                                    class="small-button delete-button"
                                    onclick="deleteSword(${index})">

                                    刪除

                                </button>


                            </div>


                        </div>

                    `;


                    display.appendChild(
                        card
                    );


                }
            );


        }



        /*
         * =========================
         * 開始移動
         * =========================
         */


        function startMove(index) {


            movingIndex = index;


            const sword =
                addedSwords[index];


            document.getElementById(
                "move-sword-name"
            ).textContent =
                "目前選擇："
                + (index + 1)
                + ". "
                + sword.name
                + "　"
                + sword.type;


            updateMovePositionList();


            document.getElementById(
                "move-area"
            ).style.display = "block";


            document.querySelector(
                'input[name="move-position"][value="last"]'
            ).checked = true;


            changeMovePosition();


            window.scrollTo(
                0,
                document.getElementById(
                    "move-area"
                ).offsetTop - 20
            );


        }



        /*
         * =========================
         * 更新移動位置清單
         * =========================
         */


        function updateMovePositionList() {


            const select =
                document.getElementById(
                    "move-position-select"
                );


            select.innerHTML =
                '<option value="">請選擇要移到誰的「前面」</option>';


            addedSwords.forEach(
                function(sword, index) {


                    /*
                     * 不顯示自己
                     */


                    if (
                        index === movingIndex
                    ) {

                        return;

                    }


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = index;


                    option.textContent =
                        (index + 1)
                        + ". "
                        + sword.name
                        + "　"
                        + sword.type
                        + " 的前面";


                    select.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 切換移動位置
         * =========================
         */


        function changeMovePosition() {


            const selected =
                document.querySelector(
                    'input[name="move-position"]:checked'
                ).value;


            const select =
                document.getElementById(
                    "move-position-select"
                );


            if (
                selected === "last"
            ) {


                select.disabled = true;


            } else {


                select.disabled = false;


            }


        }



        /*
         * =========================
         * 確定移動
         * =========================
         */


        function confirmMove() {


            if (
                movingIndex < 0
            ) {

                return;

            }


            const position =
                document.querySelector(
                    'input[name="move-position"]:checked'
                ).value;



            /*
             * 先取出這把刀
             */


            const movingSword =
                addedSwords.splice(
                    movingIndex,
                    1
                )[0];



            /*
             * 移到最後
             */


            if (
                position === "last"
            ) {


                addedSwords.push(
                    movingSword
                );


            }


            /*
             * 移到某把刀前面
             */


            else {


                const select =
                    document.getElementById(
                        "move-position-select"
                    );


                const targetIndex =
                    parseInt(
                        select.value
                    );


                if (
                    isNaN(targetIndex)
                ) {


                    /*
                     * 如果沒有選擇
                     * 放回原本位置
                     */


                    addedSwords.splice(
                        movingIndex,
                        0,
                        movingSword
                    );


                    alert(
                        "請選擇新的位置"
                    );


                    return;

                }


                /*
                 * 因為前面已經移走
                 * 一把刀
                 * 所以需要重新計算位置
                 */


                let newIndex =
                    targetIndex;


                if (
                    targetIndex > movingIndex
                ) {

                    newIndex--;

                }


                addedSwords.splice(
                    newIndex,
                    0,
                    movingSword
                );


            }



            renderSwords();


            updatePositionList();


            closeMoveArea();


        }



        /*
         * =========================
         * 關閉移動區
         * =========================
         */


        function closeMoveArea() {


            movingIndex = -1;


            document.getElementById(
                "move-area"
            ).style.display = "none";


        }



        /*
         * =========================
         * 刪除刀劍
         * =========================
         */


        function deleteSword(index) {


            const sword =
                addedSwords[index];


            const confirmed =
                confirm(
                    "確定要刪除「"
                    + sword.name
                    + "」嗎？"
                );


            if (!confirmed) {

                return;

            }


            addedSwords.splice(
                index,
                1
            );


            renderSwords();


            updatePositionList();


        }


    </script>


</body>

</html>
