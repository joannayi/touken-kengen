<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>刀劍男士顕現帳</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft JhengHei",
                sans-serif;

            background-color: #f5f1e8;

            color: #333;

            margin: 0;

            padding: 20px;

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        /* =========================
           數量
           ========================= */


        #sword-count {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }



        /* =========================
           追加按鈕
           ========================= */


        .add-area {

            text-align: center;

            margin-bottom: 25px;

        }


        button {

            padding: 10px 18px;

            font-size: 16px;

            cursor: pointer;

            border: none;

            border-radius: 8px;

            background-color: #8b6f47;

            color: white;

        }


        button:hover {

            background-color: #6f5635;

        }



        /* =========================
           追加區
           ========================= */


        #select-area {

            display: none;

            max-width: 600px;

            margin: 20px auto;

            padding: 20px;

            background-color: white;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);

        }


        .step-title {

            margin-top: 20px;

            margin-bottom: 12px;

        }


        .types {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .type-button {

            background-color: #ddd;

            color: #333;

        }


        .type-button.selected {

            background-color: #8b6f47;

            color: white;

        }


        select {

            width: 100%;

            padding: 12px;

            font-size: 16px;

            margin-bottom: 15px;

        }


        .position-option {

            display: flex;

            align-items: center;

            gap: 8px;

            margin: 12px 0;

            font-size: 16px;

        }


        .position-option input {

            width: 18px;

            height: 18px;

        }


        #position-select {

            margin-top: 5px;

        }



        /* =========================
           圖片顯示區
           ========================= */


        #display-area {

            width: 100%;

            max-width: 1200px;

            margin: 30px auto;

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;

        }



        /* =========================
           每把刀
           ========================= */


        .sword-card {

            background-color: white;

            border-radius: 12px;

            padding: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);

            overflow: hidden;

        }


        .sword-image-area {

            width: 100%;

            aspect-ratio: 3 / 4;

            background-color: #eee;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            margin-bottom: 10px;

        }


        .sword-image {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }


        .no-image {

            color: #999;

            font-size: 14px;

            text-align: center;

            padding: 20px;

        }


        .sword-number {

            color: #777;

            font-size: 14px;

        }


        .sword-name {

            font-size: 20px;

            margin: 5px 0;

        }


        .sword-type {

            color: #8b6f47;

        }


        .sword-actions {

            display: flex;

            gap: 8px;

            margin-top: 12px;

        }


        .small-button {

            padding: 7px 12px;

            font-size: 14px;

        }


        .move-button {

            background-color: #6b7a5c;

        }


        .delete-button {

            background-color: #a55a5a;

        }



        /* =========================
           移動區
           ========================= */


        #move-area {

            display: none;

            max-width: 600px;

            margin: 20px auto;

            padding: 20px;

            background-color: #fff8e8;

            border: 2px solid #d6bd8a;

            border-radius: 12px;

        }


        .move-title {

            margin-top: 0;

        }


        .close-button {

            background-color: #999;

            margin-left: 8px;

        }



        /* =========================
           手機畫面
           ========================= */


        @media (max-width: 600px) {

            body {

                padding: 12px;

            }


            #display-area {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

            }


            .sword-card {

                padding: 8px;

            }


            .sword-name {

                font-size: 16px;

            }


            .sword-actions {

                flex-direction: column;

            }


            .small-button {

                width: 100%;

            }

        }


    </style>

</head>


<body>


    <h1>刀劍男士顕現帳</h1>


    <!-- =========================
         刀劍數量
         ========================= -->


    <div id="sword-count">

        目前共有 0 把刀劍

    </div>



    <!-- =========================
         追加按鈕
         ========================= -->


    <div class="add-area">

        <button onclick="openSelector()">

            ＋ 追加

        </button>

    </div>



    <!-- =========================
         追加區
         ========================= -->


    <div id="select-area">


        <h2>① 選擇刀種</h2>


        <div class="types">


            <button
                class="type-button"
                onclick="selectType('短刀', this)">

                短刀

            </button>


            <button
                class="type-button"
                onclick="selectType('脇差', this)">

                脇差

            </button>


            <button
                class="type-button"
                onclick="selectType('打刀', this)">

                打刀

            </button>


            <button
                class="type-button"
                onclick="selectType('太刀', this)">

                太刀

            </button>


            <button
                class="type-button"
                onclick="selectType('大太刀', this)">

                大太刀

            </button>


            <button
                class="type-button"
                onclick="selectType('槍', this)">

                槍

            </button>


            <button
                class="type-button"
                onclick="selectType('薙刀', this)">

                薙刀

            </button>


        </div>



        <h2 class="step-title">

            ② 選擇刀名

        </h2>


        <select id="sword-select">


            <option value="">

                請先選擇刀種

            </option>


        </select>



        <h2 class="step-title">

            ③ 選擇插入位置

        </h2>



        <label class="position-option">


            <input
                type="radio"
                name="position"
                value="last"
                checked
                onchange="changePosition()">


            <span>

                最後

            </span>


        </label>



        <label class="position-option">


            <input
                type="radio"
                name="position"
                value="insert"
                onchange="changePosition()">


            <span>

                插入位置

            </span>


        </label>



        <select
            id="position-select"
            disabled>


            <option value="">

                請選擇要插在誰的「前面」

            </option>


        </select>



        <br>


        <button onclick="addSword()">

            追加這把刀

        </button>


        <button
            class="close-button"
            onclick="closeSelector()">

            關閉

        </button>


    </div>



    <!-- =========================
         移動區
         ========================= -->


    <div id="move-area">


        <h2 class="move-title">

            移動刀劍

        </h2>


        <p id="move-sword-name"></p>


        <h3>

            選擇新的位置

        </h3>


        <label class="position-option">


            <input
                type="radio"
                name="move-position"
                value="last"
                checked
                onchange="changeMovePosition()">


            <span>

                最後

            </span>


        </label>


        <label class="position-option">


            <input
                type="radio"
                name="move-position"
                value="insert"
                onchange="changeMovePosition()">


            <span>

                插入位置

            </span>


        </label>


        <select
            id="move-position-select"
            disabled>


            <option value="">

                請選擇要移到誰的「前面」

            </option>


        </select>


        <br>


        <button onclick="confirmMove()">

            確定移動

        </button>


        <button
            class="close-button"
            onclick="closeMoveArea()">

            取消

        </button>


    </div>



    <!-- =========================
         刀劍顯示區
         ========================= -->


    <div id="display-area"></div>



    <script>


        /*
         * =========================
         * 刀種與刀名
         * =========================
         */


        const swords = {


            "短刀": [

                "今剣",

                "愛染国俊",

                "秋田藤四郎",

                "厚藤四郎"

            ],


            "脇差": [

                "鯰尾藤四郎",

                "骨喰藤四郎",

                "堀川国広"

            ],


            "打刀": [

                "加州清光",

                "歌仙兼定",

                "陸奥守吉行",

                "山姥切国広"

            ],


            "太刀": [

                "三日月宗近",

                "小狐丸",

                "一期一振",

                "鶴丸国永"

            ],


            "大太刀": [

                "蛍丸",

                "太郎太刀",

                "次郎太刀"

            ],


            "槍": [

                "蜻蛉切",

                "日本号",

                "御手杵"

            ],


            "薙刀": [

                "岩融",

                "巴形薙刀",

                "静形薙刀"

            ]

        };



        /*
         * =========================
         * 目前選擇的刀種
         * =========================
         */


        let selectedType = "";



        /*
         * =========================
         * 已追加刀劍
         * =========================
         */


        let addedSwords = [];



        /*
         * =========================
         * 目前正在移動的刀
         * =========================
         */


        let movingIndex = -1;



        /*
         * =========================
         * 開啟追加
         * =========================
         */


        function openSelector() {


            document
                .getElementById("select-area")
                .style.display = "block";


            updatePositionList();


        }



        /*
         * =========================
         * 關閉追加
         * =========================
         */


        function closeSelector() {


            document
                .getElementById("select-area")
                .style.display = "none";


        }



        /*
         * =========================
         * 選擇刀種
         * =========================
         */


        function selectType(type, button) {


            selectedType = type;


            const buttons =
                document.querySelectorAll(
                    ".type-button"
                );


            buttons.forEach(function(btn) {

                btn.classList.remove("selected");

            });


            button.classList.add("selected");


            const select =
                document.getElementById(
                    "sword-select"
                );


            select.innerHTML =
                '<option value="">請選擇刀名</option>';


            swords[type].forEach(
                function(sword) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = sword;

                    option.textContent = sword;


                    select.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 切換追加位置
         * =========================
         */


        function changePosition() {


            const selected =
                document.querySelector(
                    'input[name="position"]:checked'
                ).value;


            const positionSelect =
                document.getElementById(
                    "position-select"
                );


            if (
                selected === "last"
            ) {


                positionSelect.disabled = true;


            } else {


                positionSelect.disabled = false;


            }


        }



        /*
         * =========================
         * 更新追加位置
         * =========================
         */


        function updatePositionList() {


            const positionSelect =
                document.getElementById(
                    "position-select"
                );


            positionSelect.innerHTML =
                '<option value="">請選擇要插在誰的「前面」</option>';


            addedSwords.forEach(
                function(sword, index) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = index;


                    option.textContent =
                        (index + 1)
                        + ". "
                        + sword.name
                        + "　"
                        + sword.type
                        + " 的前面";


                    positionSelect.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 追加刀劍
         * =========================
         */


        function addSword() {


            const select =
                document.getElementById(
                    "sword-select"
                );


            const swordName =
                select.value;


            if (!selectedType) {


                alert(
                    "請先選擇刀種"
                );


                return;


            }


            if (!swordName) {


                alert(
                    "請選擇刀名"
                );


                return;


            }



            const alreadyAdded =
                addedSwords.some(
                    function(sword) {

                        return sword.name
                            === swordName;

                    }
                );


            if (alreadyAdded) {


                alert(
                    "這把刀已經追加過了"
                );


                return;


            }



            const newSword = {


                name: swordName,

                type: selectedType

            };



            const position =
                document.querySelector(
                    'input[name="position"]:checked'
                ).value;



            if (
                position === "last"
            ) {


                addedSwords.push(
                    newSword
                );


            } else {


                const positionSelect =
                    document.getElementById(
                        "position-select"
                    );


                const insertIndex =
                    parseInt(
                        positionSelect.value
                    );


                if (
                    isNaN(insertIndex)
                ) {


                    alert(
                        "請選擇插入位置"
                    );


                    return;


                }


                addedSwords.splice(
                    insertIndex,
                    0,
                    newSword
                );


            }



            renderSwords();


            updatePositionList();


            document.querySelector(
                'input[name="position"][value="last"]'
            ).checked = true;


            changePosition();


            select.value = "";


        }



        /*
         * =========================
         * 顯示刀劍
         * =========================
         */


        function renderSwords() {


            const display =
                document.getElementById(
                    "display-area"
                );


            display.innerHTML = "";


            /*
             * 更新數量
             */


            document.getElementById(
                "sword-count"
            ).textContent =
                "目前共有 "
                + addedSwords.length
                + " 把刀劍";



            addedSwords.forEach(
                function(sword, index) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "sword-card";


                    /*
                     * 圖片檔名
                     *
                     * 目前先使用：
                     *
                     * images/刀名.jpg
                     *
                     */


                    const imagePath =
                        "images/"
                        + sword.name
                        + ".jpg";



                    card.innerHTML = `

                        <div class="sword-image-area">

                            <img
                                class="sword-image"
                                src="${imagePath}"
                                alt="${sword.name}"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

                            <div
                                class="no-image"
                                style="display:none;">

                                圖片尚未加入

                            </div>

                        </div>


                        <div class="sword-number">

                            ${index + 1}.

                        </div>


                        <div class="sword-name">

                            ${sword.name}

                        </div>


                        <div class="sword-type">

                            ${sword.type}

                        </div>


                        <div class="sword-actions">


                            <button
                                class="small-button move-button"
                                onclick="startMove(${index})">

                                移動

                            </button>


                            <button
                                class="small-button delete-button"
                                onclick="deleteSword(${index})">

                                刪除

                            </button>


                        </div>

                    `;


                    display.appendChild(
                        card
                    );


                }
            );


        }



        /*
         * =========================
         * 開始移動
         * =========================
         */


        function startMove(index) {


            movingIndex = index;


            const sword =
                addedSwords[index];


            document.getElementById(
                "move-sword-name"
            ).textContent =
                "目前選擇："
                + (index + 1)
                + ". "
                + sword.name
                + "　"
                + sword.type;


            updateMovePositionList();


            document.getElementById(
                "move-area"
            ).style.display = "block";


            document.querySelector(
                'input[name="move-position"][value="last"]'
            ).checked = true;


            changeMovePosition();


            window.scrollTo(
                0,
                document.getElementById(
                    "move-area"
                ).offsetTop - 20
            );


        }



        /*
         * =========================
         * 更新移動位置
         * =========================
         */


        function updateMovePositionList() {


            const select =
                document.getElementById(
                    "move-position-select"
                );


            select.innerHTML =
                '<option value="">請選擇要移到誰的「前面」</option>';


            addedSwords.forEach(
                function(sword, index) {


                    if (
                        index === movingIndex
                    ) {

                        return;

                    }


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = index;


                    option.textContent =
                        (index + 1)
                        + ". "
                        + sword.name
                        + "　"
                        + sword.type
                        + " 的前面";


                    select.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 切換移動位置
         * =========================
         */


        function changeMovePosition() {


            const selected =
                document.querySelector(
                    'input[name="move-position"]:checked'
                ).value;


            const select =
                document.getElementById(
                    "move-position-select"
                );


            if (
                selected === "last"
            ) {


                select.disabled = true;


            } else {


                select.disabled = false;


            }


        }



        /*
         * =========================
         * 確定移動
         * =========================
         */


        function confirmMove() {


            if (
                movingIndex < 0
            ) {

                return;

            }


            const position =
                document.querySelector(
                    'input[name="move-position"]:checked'
                ).value;


            const movingSword =
                addedSwords.splice(
                    movingIndex,
                    1
                )[0];



            if (
                position === "last"
            ) {


                addedSwords.push(
                    movingSword
                );


            } else {


                const select =
                    document.getElementById(
                        "move-position-select"
                    );


                const targetIndex =
                    parseInt(
                        select.value
                    );


                if (
                    isNaN(targetIndex)
                ) {


                    addedSwords.splice(
                        movingIndex,
                        0,
                        movingSword
                    );


                    alert(
                        "請選擇新的位置"
                    );


                    return;

                }


                let newIndex =
                    targetIndex;


                if (
                    targetIndex > movingIndex
                ) {

                    newIndex--;

                }


                addedSwords.splice(
                    newIndex,
                    0,
                    movingSword
                );


            }



            renderSwords();


            updatePositionList();


            closeMoveArea();


        }



        /*
         * =========================
         * 關閉移動
         * =========================
         */


        function closeMoveArea() {


            movingIndex = -1;


            document.getElementById(
                "move-area"
            ).style.display = "none";


        }



        /*
         * =========================
         * 刪除
         * =========================
         */


        function deleteSword(index) {


            const sword =
                addedSwords[index];


            const confirmed =
                confirm(
                    "確定要刪除「"
                    + sword.name
                    + "」嗎？"
                );


            if (!confirmed) {

                return;

            }


            addedSwords.splice(
                index,
                1
            );


            renderSwords();


            updatePositionList();


        }



        /*
         * =========================
         * 初始畫面
         * =========================
         */


        renderSwords();


    </script>


</body>

</html>
