<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>刀劍男士顕現帳</title>


    <style>

        body {

            font-family: sans-serif;

            background-color: #f5f1e8;

            color: #333;

            margin: 0;

            padding: 20px;

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        .add-area {

            text-align: center;

            margin-bottom: 25px;

        }


        button {

            padding: 12px 20px;

            font-size: 16px;

            cursor: pointer;

            border: none;

            border-radius: 8px;

            background-color: #8b6f47;

            color: white;

        }


        button:hover {

            background-color: #6f5635;

        }


        #select-area {

            display: none;

            max-width: 600px;

            margin: 20px auto;

            padding: 20px;

            background-color: white;

            border-radius: 12px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);

        }


        .step-title {

            margin-top: 20px;

            margin-bottom: 12px;

        }


        .types {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .type-button {

            background-color: #ddd;

            color: #333;

        }


        .type-button.selected {

            background-color: #8b6f47;

            color: white;

        }


        select {

            width: 100%;

            padding: 12px;

            font-size: 16px;

            margin-bottom: 15px;

            box-sizing: border-box;

        }


        .position-option {

            display: flex;

            align-items: center;

            gap: 8px;

            margin: 12px 0;

            font-size: 16px;

        }


        .position-option input {

            width: 18px;

            height: 18px;

        }


        #position-select {

            margin-top: 8px;

        }


        #display-area {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 20px;

            margin-top: 30px;

        }


        .sword-card {

            background-color: white;

            border-radius: 12px;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);

            box-sizing: border-box;

            min-height: 120px;

        }


        .sword-number {

            font-size: 14px;

            color: #777;

        }


        .sword-name {

            font-size: 20px;

            margin: 8px 0;

        }


        .sword-type {

            color: #8b6f47;

        }


        .close-button {

            background-color: #999;

            margin-left: 10px;

        }


    </style>

</head>


<body>


    <h1>刀劍男士顕現帳</h1>


    <div class="add-area">

        <button onclick="openSelector()">
            ＋ 追加
        </button>

    </div>



    <div id="select-area">


        <h2>① 選擇刀種</h2>


        <div class="types">


            <button
                class="type-button"
                onclick="selectType('短刀', this)">
                短刀
            </button>


            <button
                class="type-button"
                onclick="selectType('脇差', this)">
                脇差
            </button>


            <button
                class="type-button"
                onclick="selectType('打刀', this)">
                打刀
            </button>


            <button
                class="type-button"
                onclick="selectType('太刀', this)">
                太刀
            </button>


            <button
                class="type-button"
                onclick="selectType('大太刀', this)">
                大太刀
            </button>


            <button
                class="type-button"
                onclick="selectType('槍', this)">
                槍
            </button>


            <button
                class="type-button"
                onclick="selectType('薙刀', this)">
                薙刀
            </button>


        </div>



        <h2 class="step-title">
            ② 選擇刀名
        </h2>


        <select id="sword-select">


            <option value="">
                請先選擇刀種
            </option>


        </select>



        <h2 class="step-title">
            ③ 選擇插入位置
        </h2>



        <!-- 最後 -->


        <label class="position-option">


            <input
                type="radio"
                name="position"
                value="last"
                checked
                onchange="changePosition()">


            <span>
                最後
            </span>


        </label>



        <!-- 指定位置 -->


        <label class="position-option">


            <input
                type="radio"
                name="position"
                value="insert"
                onchange="changePosition()">


            <span>
                插入位置
            </span>


        </label>



        <select
            id="position-select"
            disabled>


            <option value="">
                請選擇插入位置
            </option>


        </select>



        <br>


        <button onclick="addSword()">
            追加這把刀
        </button>


        <button
            class="close-button"
            onclick="closeSelector()">

            關閉

        </button>


    </div>



    <div id="display-area"></div>



    <script>


        /*
         * =========================
         * 刀種與刀名
         * =========================
         */


        const swords = {


            "短刀": [

                "今剣",

                "愛染国俊",

                "秋田藤四郎",

                "厚藤四郎"

            ],


            "脇差": [

                "鯰尾藤四郎",

                "骨喰藤四郎",

                "堀川国広"

            ],


            "打刀": [

                "加州清光",

                "歌仙兼定",

                "陸奥守吉行",

                "山姥切国広"

            ],


            "太刀": [

                "三日月宗近",

                "小狐丸",

                "一期一振",

                "鶴丸国永"

            ],


            "大太刀": [

                "蛍丸",

                "太郎太刀",

                "次郎太刀"

            ],


            "槍": [

                "蜻蛉切",

                "日本号",

                "御手杵"

            ],


            "薙刀": [

                "岩融",

                "巴形薙刀",

                "静形薙刀"

            ]

        };



        /*
         * =========================
         * 目前選擇的刀種
         * =========================
         */


        let selectedType = "";



        /*
         * =========================
         * 已追加刀劍
         * =========================
         */


        let addedSwords = [];



        /*
         * =========================
         * 開啟追加區
         * =========================
         */


        function openSelector() {


            document
                .getElementById("select-area")
                .style.display = "block";


            updatePositionList();


        }



        /*
         * =========================
         * 關閉追加區
         * =========================
         */


        function closeSelector() {


            document
                .getElementById("select-area")
                .style.display = "none";


        }



        /*
         * =========================
         * 選擇刀種
         * =========================
         */


        function selectType(type, button) {


            selectedType = type;


            const buttons =
                document.querySelectorAll(
                    ".type-button"
                );


            buttons.forEach(function(btn) {

                btn.classList.remove("selected");

            });


            button.classList.add("selected");


            const select =
                document.getElementById(
                    "sword-select"
                );


            select.innerHTML =
                '<option value="">請選擇刀名</option>';


            swords[type].forEach(function(sword) {


                const option =
                    document.createElement(
                        "option"
                    );


                option.value = sword;

                option.textContent = sword;


                select.appendChild(option);


            });


        }



        /*
         * =========================
         * 切換插入方式
         * =========================
         */


        function changePosition() {


            const selected =
                document.querySelector(
                    'input[name="position"]:checked'
                ).value;


            const positionSelect =
                document.getElementById(
                    "position-select"
                );


            if (selected === "last") {


                positionSelect.disabled = true;


            } else {


                positionSelect.disabled = false;


            }


        }



        /*
         * =========================
         * 更新插入位置下拉選單
         * =========================
         */


        function updatePositionList() {


            const positionSelect =
                document.getElementById(
                    "position-select"
                );


            positionSelect.innerHTML =
                '<option value="">請選擇插入位置</option>';


            addedSwords.forEach(
                function(sword, index) {


                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value = index;


                    option.textContent =
                        (index + 1)
                        + ". "
                        + sword.name
                        + "　"
                        + sword.type;


                    positionSelect.appendChild(
                        option
                    );


                }
            );


        }



        /*
         * =========================
         * 追加刀劍
         * =========================
         */


        function addSword() {


            const select =
                document.getElementById(
                    "sword-select"
                );


            const swordName =
                select.value;


            if (!selectedType) {


                alert(
                    "請先選擇刀種"
                );


                return;


            }


            if (!swordName) {


                alert(
                    "請選擇刀名"
                );


                return;


            }



            /*
             * 防止重複追加
             */


            const alreadyAdded =
                addedSwords.some(
                    function(sword) {

                        return sword.name
                            === swordName;

                    }
                );


            if (alreadyAdded) {


                alert(
                    "這把刀已經追加過了"
                );


                return;


            }



            /*
             * 建立新刀資料
             */


            const newSword = {


                name: swordName,

                type: selectedType


            };



            /*
             * 判斷放置位置
             */


            const position =
                document.querySelector(
                    'input[name="position"]:checked'
                ).value;



            if (position === "last") {


                addedSwords.push(
                    newSword
                );


            } else {


                const positionSelect =
                    document.getElementById(
                        "position-select"
                    );


                const insertIndex =
                    parseInt(
                        positionSelect.value
                    );


                if (
                    isNaN(insertIndex)
                ) {


                    alert(
                        "請選擇插入位置"
                    );


                    return;


                }


                addedSwords.splice(
                    insertIndex,
                    0,
                    newSword
                );


            }



            /*
             * 更新畫面
             */


            renderSwords();


            /*
             * 更新插入位置清單
             */


            updatePositionList();


            /*
             * 回到「最後」
             */


            document.querySelector(
                'input[name="position"][value="last"]'
            ).checked = true;


            changePosition();


            /*
             * 清除刀名選擇
             */


            select.value = "";


        }



        /*
         * =========================
         * 顯示刀劍
         * =========================
         */


        function renderSwords() {


            const display =
                document.getElementById(
                    "display-area"
                );


            display.innerHTML = "";


            addedSwords.forEach(
                function(sword, index) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "sword-card";


                    card.innerHTML = `

                        <div class="sword-number">

                            ${index + 1}.

                        </div>


                        <div class="sword-name">

                            ${sword.name}

                        </div>


                        <div class="sword-type">

                            ${sword.type}

                        </div>

                    `;


                    display.appendChild(
                        card
                    );


                }
            );


        }


    </script>


</body>

</html>
